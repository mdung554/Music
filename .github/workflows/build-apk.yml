name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Gradle config & Build Debug APK
        run: |
          PROJECT_DIR=$(find . -name "AndroidManifest.xml" -printf "%h\n" | sed 's|/app/src/main||' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Thieu thu muc app/src/main/AndroidManifest.xml tren repo! Danh sach file hien co:"
            find . -maxdepth 5
            exit 1
          fi
          echo "Found project root: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); maven("https://jitpack.io") }
          }
          rootProject.name = "XiaozhiMusicServer"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk_out/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaozhiMusicServer-debug
          path: apk_out/*.apk
